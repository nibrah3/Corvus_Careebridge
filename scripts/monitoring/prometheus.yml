# Prometheus config for Claude Code token monitoring
# Usage: prometheus --config.file=prometheus.yml
# Scrapes the OTel collector's Prometheus endpoint every 15s

global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers: []

rule_files: []

scrape_configs:
  - job_name: 'claude_code_tokens'
    static_configs:
      - targets: ['localhost:8889']
    metric_relabel_configs:
      # Keep only token usage metrics
      - source_labels: [__name__]
        regex: 'claude_code_.*'
        action: keep

  - job_name: 'careebridge_local'
    static_configs:
      - targets: ['localhost:8889']
