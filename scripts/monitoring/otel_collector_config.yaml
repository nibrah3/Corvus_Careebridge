# OpenTelemetry Collector config for Claude Code token monitoring
# Usage: otelcol --config otel_collector_config.yaml
# Install: https://opentelemetry.io/docs/collector/getting-started/

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 10s
    send_batch_size: 1000

  # Add environment label to all metrics
  attributes:
    actions:
      - key: deployment.environment
        value: careebridge-desktop
        action: upsert

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: claude_code
    # Expose these metrics to Prometheus scraping

  logging:
    loglevel: warn

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch, attributes]
      exporters: [prometheus, logging]
